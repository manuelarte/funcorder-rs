[package]
name = "funcorder_rs"
version = "0.1.0"
authors = ["Manuel Doncel Martos"]
description = "A dylint linter that checks the order of methods within an impl block (constructors, public, private)"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "9fca3bc9fc2bc83c60bde26d18ed68f11564b228" }
dylint_linting = "6.4.0"

[dev-dependencies]
dylint_testing = "6.4.0"

[package.metadata.rust-analyzer]
rustc_private = true

[workspace.metadata.dylint]
libraries = [
    { git = "https://github.com/manuelarte/funcorder-rs" },
]
